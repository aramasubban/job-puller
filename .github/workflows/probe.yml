name: Probe official employer feeds
on:
  push:
    paths:
      - tools/probe_enterprise.py
      - .github/workflows/probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public career feed response shapes
        run: python tools/probe_enterprise.py
